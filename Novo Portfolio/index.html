<head>

   <style>
:root {
    --primary-blue: #051f20;
    --accent-blue: #163832;
    --bg-gray: #daf1de; 
    --card-white: #ffffff;
    --text-dark: #051f20;
    --text-muted: #235347;
    --border-color: #8eb69b;
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--primary-blue);
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-menu ul {
            display: flex;
            list-style: none;
            gap: 15px;
        }

        .nav-menu a {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .hero-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 25px;
        }

        .hero-container {
            max-width: 1000px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        .greeting {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-blue);
        }

        .hero-text h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            margin: 15px 0;
            color: var(--text-dark);
        }

        .surname {
            color: var(--primary-blue);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .social-links {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #ffffff;
            color: var(--primary-blue);
            border: 1px solid var(--border-color);
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .social-links a:hover {
            background-color: var(--primary-blue);
            color: #ffffff;
        }

        .btn-cv {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 999px;
            background-color: var(--primary-blue);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 18px rgba(5, 31, 32, 0.2);
        }

        .btn-cv:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(5, 31, 32, 0.25);
        }

        .arch-frame {
            width: 300px;
            height: 400px;
            border: 2px solid var(--primary-blue);
            border-radius: 150px 150px 20px 20px;
            overflow: hidden;
            background-color: #ffffff;
        }

        .arch-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background-color: var(--primary-blue);
            color: #ffffff;
            font-size: 0.9rem;
            margin-top: auto;
        }

        .footer p {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
    </style>
</head>

                    <a href="https://www.tiktok.com/@little.little_foxx?_r=1&_t=ZS-99n2wJpp1Hw" target="_blank" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>

                    <a href="Curriculum.pdf" download class="btn-cv">
                        <i class="fa-solid fa-file-arrow-down"></i> Ver Curriculum Vitae

            <div class="hero-image-wrapper">
